name: Deploy GreenCompute to Cloudflare Workers

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # PRODUCTION DEPLOY  (push to master/main)
  # 1. Apply D1 migrations against the live database
  # 2. Deploy the Worker + static assets
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply D1 Migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply greencompute-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # ──────────────────────────────────────────────────────────────────────────
  # PREVIEW  (pull request → upload a preview version, no production deploy)
  # Uses `versions upload` to create an isolated preview URL via Workers
  # Versions & Deployments without touching the live deployment.
  # ──────────────────────────────────────────────────────────────────────────
  preview:
    name: Upload Preview Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Preview Version
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
