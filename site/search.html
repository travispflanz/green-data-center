<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — GreenCompute</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    .search-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .search-form {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .search-input {
      flex: 1;
      padding: 0.8rem;
      font-size: 1.1rem;
      border: 1px solid var(--border, #ccc);
      border-radius: 4px;
    }
    .search-button {
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
      background: var(--accent, #2ecc71);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .search-button:hover {
      background: #27ae60;
    }
    #results {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .post-card {
      border: 1px solid var(--border, #eee);
      padding: 1.5rem;
      border-radius: 8px;
    }
    .post-card h2 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }
    .post-card a {
      color: inherit;
      text-decoration: none;
    }
    .post-card a:hover {
      color: var(--accent, #2ecc71);
    }
    .post-card p {
      margin: 0;
      color: #666;
    }
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
    .error {
      color: #e74c3c;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">GreenCompute</a>
    <nav>
      <a href="/blog/">Blog</a>
      <a href="/facilities.html">Facilities</a>
      <a href="/sources.html">Sources</a>
      <a href="/contact.html">Contact</a>
      <a href="/search.html">Search</a>
    </nav>
  </header>
  
  <main>
    <div class="search-container">
      <h1>Search Articles</h1>
      
      <form class="search-form" id="search-form">
        <input type="text" id="search-input" class="search-input" placeholder="Search for cooling, energy, nuclear..." required>
        <button type="submit" class="search-button">Search</button>
      </form>
      
      <div id="results"></div>
    </div>
  </main>
  
  <footer class="site-footer">
    <p>&copy; 2026 GreenCompute. Edge-hosted on Cloudflare Workers.</p>
  </footer>

  <script>
    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="loading">Searching semantic space...</div>';
      
      try {
        const response = await fetch('/api/search?q=' + encodeURIComponent(query));
        const data = await response.json();
        
        if (data.error) {
          resultsDiv.innerHTML = \`<div class="error">Error: \${data.error}</div>\`;
          return;
        }
        
        if (!data.results || data.results.length === 0) {
          resultsDiv.innerHTML = '<p>No results found for that query.</p>';
          return;
        }
        
        resultsDiv.innerHTML = data.results.map(post => \`
          <article class="post-card">
            <h2><a href="/blog/\${post.slug}">\${post.title}</a></h2>
            \${post.summary ? \`<p>\${post.summary}</p>\` : ''}
          </article>
        \`).join('');
        
      } catch (err) {
        resultsDiv.innerHTML = \`<div class="error">Failed to connect to search API.</div>\`;
      }
    });
  </script>
</body>
</html>
